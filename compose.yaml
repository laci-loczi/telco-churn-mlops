# Local MLOps services for the Telco churn project: Postgres + Silo + MLflow.
# Adapted from the course's Week 2/4 lab stack.
#
# The explicit project name matters: without it Compose names the project after
# the directory, and could share containers/volumes with another stack.
name: telco-churn-mlops

services:
  # MLflow's backend store (experiments, runs, params, metrics, registry).
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5632}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Silo: S3-compatible object store (community MinIO fork, same MINIO_* vars).
  # Holds MLflow artifacts and the DVC remote.
  s3:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "${S3_API_PORT:-5610}:9000"
      - "${S3_CONSOLE_PORT:-5611}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: create both buckets once Silo is healthy (idempotent).
  s3-create-bucket:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      bash -c "
        mc alias set s3 http://s3:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
        mc mb --ignore-existing s3/${MLFLOW_BUCKET} &&
        mc mb --ignore-existing s3/${DVC_BUCKET}
      "

  # MLflow tracking server + model registry. Artifacts are proxied to Silo, so
  # the client only needs MLFLOW_TRACKING_URI; S3 credentials stay server-side.
  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://s3:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    command:
      - --backend-store-uri
      # Explicit driver: SQLAlchemy 2.1 changed the default for postgresql://.
      - postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - --artifacts-destination
      - s3://${MLFLOW_BUCKET}
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --allowed-hosts
      - "localhost,127.0.0.1,mlflow,localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "${MLFLOW_PORT:-5600}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data:
