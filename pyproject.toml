[project]
name = "mlops-project"
version = "0.1.0"
description = "Telco customer churn — a reproducible MLOps project (HW1–HW5)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.8.0",
    "pandas>=2.0.0,<3",        # upper bound: stay on one pandas major
    "python-dotenv>=1.0.0",
    "mlflow==3.13.0",          # must match the server pin in mlflow.Dockerfile
    "dvc[s3]>=3.67.1",
    "joblib>=1.4.0",
    "pyyaml>=6.0",
    "pandera[pandas]>=0.32.1",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs the Docker Compose stack (MLflow) running; skipped otherwise",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_project"]
